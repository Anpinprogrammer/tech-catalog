<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Servicios — NexaTech</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <link rel="stylesheet" href="../styles/index.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<header class="header" id="header">
  <nav class="nav container">
    <a href="../index.html" class="nav__logo"><span class="logo-mark">N</span>exaTech</a>
    <ul class="nav__menu" id="navMenu">
      <li><a href="../index.html" class="nav__link">Inicio</a></li>
      <li><a href="catalog.html" class="nav__link active">Servicios</a></li>
      <li><a href="favorites.html" class="nav__link">Favoritos <span class="fav-badge" id="favBadge">0</span></a></li>
      <li><a href="admin.html" class="nav__link">Admin</a></li>
      <li><a href="contact.html" class="nav__link nav__link--cta">Contacto</a></li>
    </ul>
    <button class="nav__burger" id="navBurger" aria-label="Menú"><span></span><span></span><span></span></button>
  </nav>
</header>

<div class="page-hero">
  <div class="container page-hero__content">
    <span class="section__tag">// Nuestro Catálogo</span>
    <h1>Todos los servicios</h1>
    <p>Explora nuestro ecosistema completo de soluciones tecnológicas.</p>
  </div>
</div>

<section class="section" style="padding-top: 40px;">
  <div class="container">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Buscar servicios..." aria-label="Buscar" />
      <span class="search-icon">🔍</span>
    </div>
    <div class="filters" id="filters"></div>
    <div id="resultsCount" style="text-align:center; color:var(--text-muted); font-size:0.88rem; margin-bottom:24px;"></div>
    <div class="cards-grid" id="catalogGrid"></div>
    <div id="emptyState" style="display:none; text-align:center; padding:80px 24px; color:var(--text-muted);">
      <div style="font-size:3rem; margin-bottom:16px; opacity:0.4">🔍</div>
      <h3 style="font-family:var(--font-head); font-size:1.4rem; margin:0 0 8px; color:var(--text)">Sin resultados</h3>
      <p>Intenta con otra categoría o término de búsqueda.</p>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer__bottom">
      <p>© 2025 NexaTech. Todos los derechos reservados.</p>
    </div>
  </div>
</footer>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/catalog.js"></script>
</body>
</html>
